# ╔══════════════════════════════════════════════════════════════╗
# ║         spotify-plugin-caelestia configuration              ║
# ║   Edit freely — changes take effect on next track change.   ║
# ╚══════════════════════════════════════════════════════════════╝
#
# This file is sourced as bash. Restart the service after editing:
#   systemctl --user restart spotify-wallpaper

# ─── Album Art ───────────────────────────────────────────────────
# Size of the album art square, in pixels
COVER_SIZE=480

# Corner radius of the rounded album art
RADIUS=30

# ─── Background ──────────────────────────────────────────────────
# Blur strength applied to the blurred background (higher = blurrier)
BLUR_STRENGTH=30

# Background darkening percentage (0 = no darkening, 100 = pitch black)
DARKEN_AMOUNT=35

# ─── Fonts ───────────────────────────────────────────────────────
# Full path to your preferred bold font (for the track title)
FONT_BOLD="/usr/share/fonts/TTF/JetBrainsMonoNerdFont-Bold.ttf"

# Full path to your preferred regular font (for the artist name)
FONT_REGULAR="/usr/share/fonts/TTF/JetBrainsMonoNerdFont-Regular.ttf"

# Font sizes (in points)
TITLE_SIZE=40
ARTIST_SIZE=26

# ─── Text ────────────────────────────────────────────────────────
# Maximum characters before title/artist gets truncated with "..."
MAX_CHARS=28

# ─── Layout ──────────────────────────────────────────────────────
# Vertical shift of the cover from screen center (negative = up)
VERTICAL_OFFSET=-80

# ─── Monitors ────────────────────────────────────────────────────
# Monitor index used to determine wallpaper resolution
# (0 = primary monitor as reported by hyprctl)
PRIMARY_MONITOR=0

# ─── Behaviour ───────────────────────────────────────────────────
# Seconds to wait before retrying when Spotify is not running
RETRY_DELAY=5
